<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Shape -->
  <path d="M 64 8 L 112 28 C 112 76 64 116 64 116 C 64 116 16 76 16 28 Z" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="6" />
  <!-- Inner Cyber Core -->
  <path d="M 64 26 L 98 42 C 98 74 64 98 64 98 C 64 98 30 74 30 42 Z" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" opacity="0.6" />
  <!-- Center Eye / Deflector Symbol -->
  <circle cx="64" cy="60" r="14" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="64" cy="60" r="7" fill="#ffffff" />
</svg>
